<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunchFinder</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Filter</h1>
        <a href="favorites.html" class="favorite-icon">♡</a>
      </header>

      <main>
        <section class="filter-section">
          <h2>Vad är du sugen på?</h2>

          <div class="filter-grid">
            <button data-value="LOCAL" title="Klassiska svenska rätter">Husman</button>
            <button data-value="ASIAN">Asiatiskt</button>
            <button data-value="PIZZA">Pizza</button>
            <button data-value="BURGERS">Burgare</button>
            <button data-value="MEDITERRANEAN" title="Mat från andra länder (exemepelvis italienskt/mellanöstern)">Medelhavs</button>
          </div>
        </section>

        <section class="filter-section">
          <h2 class="price-title">Pris<span class="tooltip">?<span class="tooltip-text">
            $ = Under 100 kr<br>
            $$ = 100-150 kr<br>
            $$$ = Över 150 kr</span>
            </span>
        </h2>

          <div class="filter-grid">
            <button title="Under 100 kr">$</button>
            <button title="Mellan 100-150 kr">$$</button>
            <button title="Över 150 kr">$$$</button>
          </div>
        </section>

        <section class="filter-section">
          <h2>Avstånd</h2>

          <select id="distance-filter">
            <option value="">Välj avstånd</option>
            <option value="0.5">Inom 500 m</option>
            <option value="2">Inom 2 km</option>
            <option value="5">Inom 5 km</option>
          </select>

          <p id="distance-error" style="display: none; color:#b54040; font-size:14px; margin-top:8px;">Välj ett avstånd</p>
        </section>

        <a href="result.html">
          <button class="result-button">Visa resultat</button>
        </a>
      </main>
    </div>

    <script src="./js/filter.js"></script>
  </body>
</html>
