<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchFinder</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">

        <header>
            <h1>LunchFinder</h1>
            <a href="favorites.html" class="favorite-icon">♡</a>
        </header>

        <main>

            <section class="hero-section">
                <img src="images/LF.svg" alt="LunchFinder logotyp" class="hero-logo">
                <h2>Hitta lunchställen nära dig</h2>

                <div class="plats-kort">
                    <img src="images/location-icon.svg" alt="Platsikon" class="plats-ikon">

                    <p>
                        Vi behöver din plats för att visa lunchställen nära dig
                    </p>

                    <button class="location-button">
                        Tillåt platsåtkomst
                    </button>
                    </a>
                </div>
            </section>

            <div class="features">

                <div class="feature">
                    <div class="feature-icon"></div>

                    <div>
                        <strong>Snabbt och enkelt</strong>

                        <p>
                            Hitta ett lunchställe på under en minut
                        </p>
                    </div>
                </div>

                <div class="feature">
                    <div class="feature-icon"></div>

                    <div>
                        <strong>Nära dig</strong>

                        <p>
                            Sorterat efter avstånd från din position
                        </p>
                    </div>
                </div>

                <div class="feature">
                    <img src="images/heart-icon.svg" alt="Favoritikon" class="favorite-icon">

                    <div>
                        <strong>Spara favoriter</strong>

                        <p>
                            Kom ihåg dina favoritställen
                        </p>
                    </div>
                </div>

            </div>

        </main>

    </div>

<script src="./js/storage.js"></script>
<script src="./js/favorites.js"></script>
<script src="./js/geolocation.js"></script>

</body>
</html>
