<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchFinder</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    
    <div class="container">
        <header>
            <h1>Filter</h1>
            <button class="favorite-icon">♡</button>
        </header>

        <main>
            <section class="filter-section">
                <h2>Vad är du sugen på?</h2>

                <div class="filter-grid">

                    <button>Snabbmat</button>
                    <button>Sushi</button>
                    <button>Pizza</button>

                    <button>Vegetariskt</button>
                    <button>Hälsosamt</button>
                    <button>Restaurang</button>

                </div>
            </section>

            <section class="filter-section">
                <h2>Pris</h2>

                <div class="filter-grid">
                    <button>Under 100 kr</button>
                    <button>100 - 150 kr</button>
                    <button>150+ kr</button>

                </div>
            </section>

            <section class="filter-section">
                <h2>Avstånd</h2>

                <select>
                    <option>Inom 2 km</option>
                    <option>Inom 5 km</option>
                    <option>Inom 10 km</option>   
                </select>

            </section>

            <a href="result.html">
                <button class="result-button">
                    Visa resultat
                </button>
            </a>
            
        </main>
    </div>
</body>
</html>
