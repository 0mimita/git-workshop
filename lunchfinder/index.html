<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchFinder</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">

        <header>
            <h1>LunchFinder</h1>
            <button class="favorite-icon">♡</button>
        </header>

        <main>

            <section class="hero-section">
                <div class="hero-icon"></div>

                <h2>Hitta lunchställen nära dig</h2>

                <div class="plats-kort">
                    <div class="plats-icon"></div>

                    <p>
                        Vi behöver din plats för att visa lunchställen nära dig
                    </p>

                    <a href="filter.html">
                        <button>
                            Tillåt platsåtkomst
                        </button>
                    </a>
                </div>
            </section>

            <div class="features">

                <div class="feature">
                    <div class="feature-icon"></div>

                    <div>
                        <strong>Snabbt och enkelt</strong>

                        <p>
                            Hitta ett lunchställe på under en minut
                        </p>
                    </div>
                </div>

                <div class="feature">
                    <div class="feature-icon"></div>

                    <div>
                        <strong>Nära dig</strong>

                        <p>
                            Sorterat efter avstånd från din position
                        </p>
                    </div>
                </div>

                <div class="feature">
                    <div class="feature-icon"></div>

                    <div>
                        <strong>Spara favoriter</strong>

                        <p>
                            Kom ihåg dina favoritställen
                        </p>
                    </div>
                </div>

            </div>

        </main>

    </div>
</body>
</html>
