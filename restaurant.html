<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchFinder</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <div class="container">
        <header>
            <button id="back-button" class="back-navigation" title="Gå tillbaka">
                <img src="images/arrow-icon.svg" alt="Bakåt">
            </button>

            <h1 id="restaurant-name"></h1>
            <a href="favorites.html" class="favorite-icon">
                <img src="images/heart-icon.svg" alt="Favorit">
            </a>
        </header>

        <main>
            <section class="restaurant-banner"></section>

            <section class="restaurant-content">
                <div class="restaurant-title large" id="restaurant-title"></div>
                <p id="restaurant-info"></p>
                <p id="restaurant-walktime" class="walktime-info"></p>
                <p id="restaurant-type"></p>
                <p id="restaurant-rating"></p>
                <p id="restaurant-tags"></p>
                <p id="restaurant-vegetarian"></p>
                <p id="restaurant-buffet"></p>
                
                <button class="navigation-button">
                    Starta navigation
                </button>

                <button class="save-button">
                    Spara favorit
                </button>

                <a id="restaurant-website" class="website-button" href="#" target="_blank" rel="noopener noreferrer">
                    Besök restaurangens webbsida 
                </a>
            </section>
        </main>
    </div>

<script src="./js/storage.js"></script>
<script src="./js/favorites.js"></script>
<script src="./js/restaurant.js"></script>

</body>
</html>
